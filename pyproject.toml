[tool.uv]
package = false
exclude-dependencies = ["pytorch-triton-rocm"]

[project]
name = "speaker-attribution-acl2023"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mike Domingues", email = "mikeicd@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "pandas>=2.3.3",
    "numpy>=1.24.4,<2.0.0",
    "transformers>=4.25.1",
    "spacy==3.4.4",
    "spacy-experimental==0.6.1",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.4.1/en_core_web_sm-3.4.1-py3-none-any.whl",
    "en-coreference-web-trf @ https://github.com/explosion/spacy-experimental/releases/download/v0.6.1/en_coreference_web_trf-3.4.0a2-py3-none-any.whl",
    "setuptools<82",
    "ipykernel>=7.3.0",
    "scipy>=1.15.3",
    "datasets>=5.0.1",
    "accelerate>=1.15.0",
    "scikit-learn>=1.7.2",
    "huggingface-hub>=0.36.2",
    "tqdm>=4.70.0",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
